name: CI

# Run on every branch and every pull request, whatever its base.  The previous
# `branches: [main, master]` filter meant work on a stacked branch (or a PR
# targeting anything other than main) got no CI at all.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        run: |
          sudo apt-get update
          sudo apt-get install -y racket
      - name: Run tests
        run: raco test tests
