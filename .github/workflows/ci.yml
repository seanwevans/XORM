name: CI

# Run on every branch and every pull request, whatever its base.  A
# `branches:` filter here means work on a stacked branch gets no CI at all.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release we claim to support and the current stable one.
        # `apt-get install racket` pinned us to whatever Ubuntu happened to
        # ship, which was neither a documented floor nor a current version.
        racket-version: ['8.10', 'stable']
    name: test (Racket ${{ matrix.racket-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: ${{ matrix.racket-version }}
          variant: 'CS'
      - name: Run tests
        run: raco test tests
